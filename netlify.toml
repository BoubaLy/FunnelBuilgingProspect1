# Configuration de déploiement Netlify.
#
# Ce fichier n'est pris en compte que sur un déploiement connecté à un
# dépôt Git ou lancé via la CLI Netlify. Un dépôt du dossier `out/` par
# glisser-déposer publie uniquement les fichiers statiques : les fonctions
# ne sont pas embarquées.

[build]
  command = "npm run build:statique"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  # Next.js 15 supporte officiellement Node 18.18, 20 et 22.
  NODE_VERSION = "22"

# Les polices sont versionnées dans leur nom de fichier : cache immuable.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
